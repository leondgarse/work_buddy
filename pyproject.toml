[project]
name = "work-buddy"
version = "0.1.0"
description = "Gather email, git, meetings and Lark into per-requirement context dossiers, with search"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6"]

[project.scripts]
wb = "work_buddy.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/work_buddy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
